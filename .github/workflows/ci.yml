name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-build:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Stash
        run: >-
          xcodebuild -project Stash.xcodeproj -scheme Stash
          -configuration Release -sdk macosx build CODE_SIGNING_ALLOWED=NO
